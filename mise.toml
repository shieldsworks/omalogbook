# `mise install` gets the toolchain; `mise tasks` lists the jobs and each
# runs as `mise <job>`.

[tools]
rust = { version = "1.98", profile = "minimal", components = "rustfmt,clippy" }

[tasks.build]
description = "Debug build"
run = "cargo build --locked"

[tasks.test]
description = "Unit tests"
run = "cargo test --locked"

[tasks.goldens]
description = "Byte-compare the sample sail with tests/golden under TZ=UTC"
env = { TZ = "UTC" }
run = "cargo test --locked --test golden -- --ignored"

[tasks.lint]
description = "rustfmt check and clippy with warnings denied"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
]

[tasks.format]
description = "rustfmt, writing"
run = "cargo fmt"

[tasks.replay]
description = "Follow a live omakeel into a new temporary vault"
run = 'dir=$(mktemp -d) && printf "%s\n" "$dir" && cargo run --locked -- run --vault "$dir" --no-git'

[tasks.verify]
description = "Lint, test, comments, qmllint, goldens, and a clean tree"
run = "scripts/verify.sh"
